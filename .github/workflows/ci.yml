name: CI - Patch Verification & Build Matrix

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate-patches:
    name: "Dry-run: ${{ matrix.name }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "PHP 5.4.45 Minimal"
            version: "5.4.45"
            patch: "patches/php-5.4-community-backport.patch"
          - name: "PHP 5.4.45 Enhanced"
            version: "5.4.45"
            patch: "patches/php-5.4-enhanced-universal.patch"
          - name: "PHP 5.5.38 Minimal"
            version: "5.5.38"
            patch: "patches/php-5.5-community-backport.patch"
          - name: "PHP 5.5.38 Enhanced"
            version: "5.5.38"
            patch: "patches/php-5.5-enhanced-universal.patch"
          - name: "PHP 5.6.40 Minimal"
            version: "5.6.40"
            patch: "patches/php-5.6-community-backport.patch"
          - name: "PHP 5.6.40 Enhanced"
            version: "5.6.40"
            patch: "patches/php-5.6-enhanced-universal.patch"
          - name: "PHP 7.1.33 Minimal"
            version: "7.1.33"
            patch: "patches/php-7.1-minimal.patch"
          - name: "PHP 7.1.33 Enhanced"
            version: "7.1.33"
            patch: "patches/php-7.1-enhanced-universal.patch"
          - name: "PHP 7.0.33 Enhanced"
            version: "7.0.33"
            patch: "patches/php-7.0-enhanced-universal.patch"
          - name: "PHP 7.2.34 Minimal"
            version: "7.2.34"
            patch: "patches/php-7.2-minimal.patch"
          - name: "PHP 7.2.34 Enhanced"
            version: "7.2.34"
            patch: "patches/php-7.2-enhanced-universal.patch"
          - name: "PHP 7.3.33 Minimal"
            version: "7.3.33"
            patch: "patches/php-7.3-minimal.patch"
          - name: "PHP 7.3.33 Enhanced"
            version: "7.3.33"
            patch: "patches/php-7.3-enhanced-universal.patch"
          - name: "PHP 7.4.33 Minimal"
            version: "7.4.33"
            patch: "patches/php-7.4-minimal.patch"
          - name: "PHP 7.4.33 Enhanced"
            version: "7.4.33"
            patch: "patches/php-7.4-enhanced-universal.patch"
          - name: "PHP 8.0.30 Minimal"
            version: "8.0.30"
            patch: "patches/php-8.0-minimal.patch"
          - name: "PHP 8.0.30 Enhanced"
            version: "8.0.30"
            patch: "patches/php-8.0-enhanced-universal.patch"
          - name: "PHP 8.1.34 Minimal"
            version: "8.1.34"
            patch: "patches/php-8.1-minimal.patch"
          - name: "PHP 8.1.34 Enhanced"
            version: "8.1.34"
            patch: "patches/php-8.1-enhanced-universal.patch"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download clean PHP ${{ matrix.version }} tarball
        run: |
          mkdir -p .tarballs
          TARBALL=".tarballs/php-${{ matrix.version }}.tar.gz"
          if [ ! -f "$TARBALL" ]; then
            curl -sSfL "https://www.php.net/distributions/php-${{ matrix.version }}.tar.gz" -o "$TARBALL"
          fi

      - name: Verify patch dry-run
        run: |
          mkdir -p test-tree
          tar -xzf .tarballs/php-${{ matrix.version }}.tar.gz -C test-tree --strip-components=1
          cd test-tree
          patch -p1 --dry-run < ../${{ matrix.patch }}
          echo "Patch ${{ matrix.patch }} applied with 0 rejected hunks!"

  validate-remi-backports:
    name: "Dry-run: Remi Collet ${{ matrix.name }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "PHP 5.6 Security Tree"
            branch: "PHP-5.6-security-backports"
            patch: "patches/php-5.6-enhanced-remicollet.patch"
          - name: "PHP 7.1 Security Tree"
            branch: "PHP-7.1-security-backports"
            patch: "patches/php-7.1-enhanced-remicollet.patch"
          - name: "PHP 7.2 Security Tree"
            branch: "PHP-7.2-Security-backports"
            patch: "patches/php-7.2-enhanced-remicollet.patch"
          - name: "PHP 7.3 Security Tree"
            branch: "PHP-7.3-security-backports"
            patch: "patches/php-7.3-enhanced-remicollet.patch"
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Clone Remi Collet security backports
        run: |
          git clone --depth 1 --branch ${{ matrix.branch }} https://github.com/remicollet/php-src-security.git remi-tree

      - name: Verify patch dry-run
        run: |
          cd remi-tree
          patch --batch -p1 --dry-run < ../${{ matrix.patch }}
          echo "Remi Collet ${{ matrix.name }} backport patch applied cleanly with 0 rejected hunks!"

  build-and-smoke-test:
    name: "Build: ${{ matrix.name }}"
    needs: [validate-patches, validate-remi-backports]
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "PHP 5.6.40 (Enhanced)"
            version: "5.6.40"
            patch: "patches/php-5.6-enhanced-universal.patch"
            cflags: "-O2 -fcommon"
          - name: "PHP 7.1.33 (Enhanced)"
            version: "7.1.33"
            patch: "patches/php-7.1-enhanced-universal.patch"
            cflags: "-O2"
          - name: "PHP 7.0.33 (Enhanced)"
            version: "7.0.33"
            patch: "patches/php-7.0-enhanced-universal.patch"
            cflags: "-O2"
          - name: "PHP 7.2.34 (Enhanced)"
            version: "7.2.34"
            patch: "patches/php-7.2-enhanced-universal.patch"
            cflags: "-O2"
          - name: "PHP 7.3.33 (Enhanced)"
            version: "7.3.33"
            patch: "patches/php-7.3-enhanced-universal.patch"
            cflags: "-O2"
          - name: "PHP 7.4.33 (Enhanced)"
            version: "7.4.33"
            patch: "patches/php-7.4-enhanced-universal.patch"
            cflags: "-O2"
          - name: "PHP 8.0.30 (Enhanced)"
            version: "8.0.30"
            patch: "patches/php-8.0-enhanced-universal.patch"
            cflags: "-O2"
          - name: "PHP 8.1.34 (Enhanced)"
            version: "8.1.34"
            patch: "patches/php-8.1-enhanced-universal.patch"
            cflags: "-O2"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential pkg-config libxml2-dev re2c

      - name: Download clean PHP ${{ matrix.version }}
        run: |
          curl -sSfL "https://www.php.net/distributions/php-${{ matrix.version }}.tar.gz" -o "php-${{ matrix.version }}.tar.gz"
          mkdir -p src && tar -xzf "php-${{ matrix.version }}.tar.gz" -C src --strip-components=1

      - name: Apply patch
        run: |
          cd src
          patch -p1 < ../${{ matrix.patch }}

      - name: Configure
        run: |
          cd src
          CFLAGS="${{ matrix.cflags }}" ./configure \
            --disable-all \
            --enable-cli \
            --enable-session

      - name: Compile CLI binary
        run: |
          cd src
          make -j$(nproc) sapi/cli/php

      - name: Smoke test binary
        run: |
          cd src
          ./sapi/cli/php -v
          ./sapi/cli/php -m | grep session
          ./sapi/cli/php -r "echo 'Tested PHP ' . PHP_VERSION . ' CLI successfully!' . PHP_EOL;"

  deploy-tooling-tests:
    name: "Unit tests: deploy tooling"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Run deploy-tooling harnesses
        run: tests/run-all.sh

; php2shell — append these lines to each FPM pool you want to harden.
; Example: /etc/php/X.Y/fpm/pool.d/www.conf
;
; Use php_admin_* so applications cannot override these back.
; Then: systemctl restart phpX.Y-fpm

php_admin_value[memory_limit] = -1
php_admin_value[post_max_size] = 32M
php_admin_value[upload_max_filesize] = 24M
php_admin_value[max_input_nesting_level] = 5
php_admin_value[max_input_vars] = 1000
php_admin_flag[session.upload_progress.enabled] = off

; Strongly consider recycling workers aggressively during the exposure
; window. Each recycled worker starts with clean global state.
; pm.max_requests = 50
